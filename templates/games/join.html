{% extends "base.html" %}
{% block title %}Вход по PIN{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-5 text-center">
                    <div style="font-size: 64px;">🔑</div>
                    <h2 class="fw-bold mb-2">Введи PIN-код</h2>
                    <p class="text-muted mb-4">Учитель покажет его на экране или скажет вслух</p>

                    <form method="post">
                        {% csrf_token %}
                        <input type="text" name="pin" maxlength="4" required
                               inputmode="numeric" pattern="\d{4}"
                               class="form-control form-control-lg text-center fw-bold mb-3"
                               style="font-size: 40px; letter-spacing: 12px;"
                               placeholder="0000" autofocus>
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Войти в игру
                        </button>
                    </form>

                    <p class="text-muted small mt-4 mb-0">
                        PIN состоит из 4 цифр, например <code>4821</code>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
