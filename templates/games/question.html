{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2">
                    <i class="bi bi-controller"></i> {{ game.title }}
                </span>
                <span class="badge bg-warning-subtle text-warning rounded-pill px-3 py-2">
                    <i class="bi bi-star-fill"></i> {{ session.quiz_score }} баллов
                </span>
            </div>

            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body p-5 text-center">
                    <p class="text-muted mb-3 small text-uppercase fw-bold">Вопрос</p>
                    <h2 class="fw-bold mb-0">{{ question.text }}</h2>
                </div>
            </div>

            <div class="row g-3" id="options">
                {% for opt in question.options.all %}
                    <div class="col-md-6">
                        <button type="button"
                                class="btn btn-outline-primary w-100 py-4 rounded-4 fw-bold fs-5 answer-btn"
                                data-option-id="{{ opt.id }}">
                            {{ opt.text }}
                        </button>
                    </div>
                {% endfor %}
            </div>

            <p class="text-center text-muted mt-4 mb-0">
                За верный ответ: <strong class="text-primary">+{{ question.points }}</strong> балл(ов)
            </p>

            <div id="feedback" class="alert mt-3 mb-0 d-none text-center fw-bold"></div>

        </div>
    </div>
</div>

<style>
.answer-btn {
    transition: all 0.25s;
    border-width: 2px;
}
.answer-btn.correct {
    background: linear-gradient(135deg, #10b981, #059669) !important;
    border-color: #10b981 !important;
    color: white !important;
    transform: scale(1.03);
    box-shadow: 0 8px 24px -6px rgba(16, 185, 129, 0.6);
}
.answer-btn.wrong {
    background: linear-gradient(135deg, #ef4444, #dc2626) !important;
    border-color: #ef4444 !important;
    color: white !important;
    animation: shake 0.4s;
    box-shadow: 0 8px 24px -6px rgba(239, 68, 68, 0.6);
}
.answer-btn.disabled {
    pointer-events: none;
    opacity: 0.5;
}
.answer-btn.correct.disabled,
.answer-btn.wrong.disabled {
    opacity: 1;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-8px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-6px); }
    80%      { transform: translateX(6px); }
}
</style>

<script>
const buttons = document.querySelectorAll('.answer-btn');
const feedback = document.getElementById('feedback');
let answered = false;

buttons.forEach(btn => {
    btn.addEventListener('click', () => {
        if (answered) return;
        answered = true;

        buttons.forEach(b => b.classList.add('disabled'));

        const optionId = btn.dataset.optionId;
        const fd = new FormData();
        fd.append('option', optionId);

        fetch("{% url 'games:answer' question.id %}", {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' },
            body: fd,
        })
        .then(r => r.json())
        .then(data => {
            const correctBtn = document.querySelector(`[data-option-id="${data.correct_option_id}"]`);
            const selectedBtn = document.querySelector(`[data-option-id="${data.selected_option_id}"]`);

            if (data.is_correct) {
                selectedBtn.classList.add('correct');
                feedback.className = 'alert alert-success mt-3 mb-0 text-center fw-bold';
                feedback.textContent = '✅ Верно! Молодец!';
            } else {
                selectedBtn.classList.add('wrong');
                if (correctBtn) correctBtn.classList.add('correct');
                feedback.className = 'alert alert-danger mt-3 mb-0 text-center fw-bold';
                feedback.textContent = '❌ Неправильно. Правильный ответ — зелёный.';
            }

            setTimeout(() => {
                window.location.href = data.next_url;
            }, 1800);
        })
        .catch(() => {
            feedback.className = 'alert alert-danger mt-3 mb-0 text-center';
            feedback.textContent = 'Ошибка сети';
            answered = false;
            buttons.forEach(b => b.classList.remove('disabled'));
        });
    });
});
</script>
{% endblock %}
