{% extends "base.html" %}
{% block title %}Вход — EasyLearnSite{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div style="font-size: 56px;">🔐</div>
                        <h2 class="fw-bold mb-1">Вход</h2>
                        <p class="text-muted small mb-0">Рады видеть снова!</p>
                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger rounded-3">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            Неверное имя пользователя или пароль
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Имя пользователя</label>
                            <input type="text" name="username" required
                                   class="form-control form-control-lg"
                                   placeholder="Введи логин" autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Пароль</label>
                            <input type="password" name="password" required
                                   class="form-control form-control-lg"
                                   placeholder="Введи пароль">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Войти
                        </button>
                    </form>

                    <p class="text-center text-muted small mt-4 mb-0">
                        Нет аккаунта?
                        <a href="{% url 'accounts:signup' %}" class="fw-bold text-decoration-none">
                            Зарегистрироваться
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
